name: Build and Deploy to PRD-TOR

on:
  push:
    branches:
      - poc/k8s-prd-tor-deployment
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      full_image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image info
        run: |
          echo "Image pushed with tags: ${{ steps.meta.outputs.tags }}"
          echo "Short SHA tag: ${{ steps.meta.outputs.version }}"

  update-helm:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Clone helm charts repo
        run: |
          git clone https://sssre:${{ secrets.GH_SSSRE_TOKEN }}@github.com/sanservices/uvi-k8-helm-charts.git helm-charts
          cd helm-charts
          git checkout poc/lucee6-groups-online-payment

      - name: Update image tag in values
        run: |
          cd helm-charts/ui/groups-online-payment-ui
          # Update the image tag in values-prd-tor.yaml
          sed -i 's|tag: ".*"|tag: "${{ needs.build-and-push.outputs.image_tag }}"|g' values-prd-tor.yaml
          echo "Updated image tag to: ${{ needs.build-and-push.outputs.image_tag }}"
          grep "tag:" values-prd-tor.yaml

      - name: Commit and push changes
        run: |
          cd helm-charts
          git config user.name "SSSRE Argo Bot"
          git config user.email "sre@sanservices.hn"
          git add .
          git diff --staged --quiet || git commit -m "groups-online-payment-ui: update image tag to ${{ needs.build-and-push.outputs.image_tag }} by ${{ github.actor }}"
          git push origin poc/lucee6-groups-online-payment
